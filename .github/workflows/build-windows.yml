name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libusb
        run: vcpkg install libusb:x64-windows

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DIQUEBREW_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/aulon.exe dist/aulon.exe
          Copy-Item build/Release/ique_modern.exe dist/ique_modern.exe
          $dll = Get-ChildItem build -Recurse -Filter libusb-1.0.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist/libusb-1.0.dll }
          Get-ChildItem dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: iQueBrew-Windows-x64
          path: dist/*
